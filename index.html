<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>キースイッチ・クラッシャー</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1e222b;
    --panel-2: #272c38;
    --line: #353b4a;
    --text: #e9ecf2;
    --muted: #98a1b3;
    --accent: #ffb547;
    --good: #6fdc8c;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 700px at 30% 20%, #232838 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; }

  .app {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    gap: 16px;
    grid-template-rows: auto 1fr;
    max-width: 1100px;
    min-height: 100%;
    margin: 0 auto;
    padding: 16px;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  h1 { margin: 0; font-size: 20px; letter-spacing: .04em; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .util { display: flex; gap: 8px; }
  .util button {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .util button:hover { background: var(--panel-2); }

  /* ---------- 左: ステージ ---------- */
  .stage {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .scrap { text-align: center; }
  .scrap .num {
    font-size: 40px;
    font-weight: 800;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .scrap .unit { font-size: 13px; color: var(--muted); }
  .rates {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .rates b { color: var(--text); font-weight: 600; }

  .kbd-wrap { margin-top: 12px; }
  .kbd-title { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .kbd-title b { color: var(--text); }
  .kbd {
    display: inline-flex;
    flex-direction: column;
    gap: 3px;
    padding: 8px;
    background: #0e1015;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .kbd .row { display: flex; gap: 3px; }
  .kbd .row:nth-child(2) { padding-left: 9px; }
  .kbd .row:nth-child(3) { padding-left: 18px; }
  .kbd .row:nth-child(4) { padding-left: 32px; }
  .kbd .k {
    width: 25px; height: 25px;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 700;
    color: var(--glow, #7cf);
    background: #2c2d33;
    border-radius: 5px;
    box-shadow: 0 2px 0 #08090b;
  }
  .kbd .k.done { background: none; color: #3d414d; box-shadow: inset 0 0 0 1px #2a2d36; text-decoration: line-through; }
  .kbd .k.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
  .target-info { margin-top: 14px; text-align: center; }
  .target-name { font-size: 16px; font-weight: 700; }
  .target-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .hp {
    width: min(360px, 100%);
    height: 18px;
    margin-top: 8px;
    background: #0e1015;
    border: 1px solid var(--line);
    border-radius: 9px;
    overflow: hidden;
    position: relative;
  }
  .hp i {
    position: absolute; inset: 0;
    transform-origin: left center;
    background: linear-gradient(90deg, #ff6b6b, #ffb547 55%, #6fdc8c);
    transition: transform .08s linear;
  }
  .hp span {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 700;
    text-shadow: 0 1px 2px #000;
    font-variant-numeric: tabular-nums;
  }

  .arena {
    position: relative;
    width: 100%;
    flex: 1;
    min-height: 330px;
    display: grid;
    place-items: center;
  }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #switch {
    position: relative;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    width: 264px;
    height: 240px;
    outline-offset: 6px;
    touch-action: manipulation;
  }
  #switch:focus-visible { outline: 1px dashed var(--line); }
  #switch svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #switch .mv { transition: transform .06s ease-out; }
  #switch.down .mv { transform: translateY(15px); transition-duration: .02s; }
  #switch.shake svg { animation: shake .12s linear; }
  #switch.spawn { animation: spawn .22s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes shake {
    0% { transform: translate(0, 0) rotate(0); }
    30% { transform: translate(-3px, 2px) rotate(-1.2deg); }
    65% { transform: translate(3px, 1px) rotate(1deg); }
    100% { transform: translate(0, 0) rotate(0); }
  }
  @keyframes spawn {
    from { transform: translateY(-50px) scale(.6); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  .crack { stroke: var(--glow, #7cf); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; filter: drop-shadow(0 0 3px var(--glow, #7cf)); }
  #legend { fill: var(--glow, #7cf); filter: drop-shadow(0 0 4px var(--glow, #7cf)); }
  #underglow { fill: var(--glow, #7cf); filter: blur(10px); opacity: .5; }
  .crack.on { opacity: .9; }

  .float {
    position: absolute;
    pointer-events: none;
    font-weight: 800;
    font-size: 20px;
    color: #fff;
    text-shadow: 0 2px 4px #000;
    animation: floatUp .8s ease-out forwards;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .float.crit { color: var(--accent); font-size: 30px; }
  .float.gain { color: var(--good); font-size: 18px; }
  @keyframes floatUp {
    from { transform: translate(-50%, -50%) scale(.7); opacity: 1; }
    20% { transform: translate(-50%, -90%) scale(1.15); }
    to { transform: translate(-50%, -220%) scale(1); opacity: 0; }
  }
  .hint { font-size: 12px; color: var(--muted); text-align: center; }

  /* ---------- 右: 工具店 ---------- */
  .stage { grid-column: 1; }
  .stage .kbd-wrap { order: 1; margin: 0 0 10px; }
  .stage .hint { order: 2; }
  .shop-title { font-size: 18px; font-weight: 800; text-align: center; letter-spacing: .2em; margin: 2px 0 10px; }
  .buy-mode { display: flex; align-items: center; gap: 6px; margin: 0 0 10px; }
  .buy-mode span { font-size: 12px; color: var(--muted); margin-right: 2px; white-space: nowrap; }
  .buy-mode button {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 0;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .buy-mode button:hover { border-color: var(--accent); }
  .buy-mode button[aria-pressed="true"] { border-color: var(--accent); background: #3a3324; color: var(--accent); }
  .item .cost small { color: var(--muted); font-weight: 600; margin-right: 6px; }
  .shop { grid-column: 2; grid-row: 2; }
  .shop {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px;
    align-self: start;
  }
  .shop h2, .dlg h2 {
    margin: 10px 4px 6px;
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: .08em;
  }
  .dlg {
    width: min(760px, calc(100vw - 24px));
    max-height: calc(100vh - 48px);
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
  }
  .dlg::backdrop { background: #000a; }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
  .dlg .dlg-head h2 { margin: 0; font-size: 15px; color: var(--text); }
  .dlg-close {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .item.up { border-style: dashed; }
  .item.up .cost { color: var(--good); }
  .item.up.locked .cost { color: var(--muted); }
  .ups-note { font-size: 11px; color: var(--muted); margin: 0 4px 6px; text-align: right; }
  .axis-note { font-size: 11px; color: var(--muted); margin: 0 4px 8px; }
  .axes { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
  .axis {
    display: grid;
    grid-template-columns: 22px 1fr;
    gap: 8px;
    align-items: center;
    text-align: left;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 8px;
    cursor: pointer;
  }
  .axis i { width: 22px; height: 22px; border-radius: 5px; border: 1px solid #0008; }
  .axis .nm { font-size: 13px; font-weight: 700; }
  .axis .ds { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .axis:not(:disabled):hover { border-color: var(--accent); }
  .axis[aria-pressed="true"] { border-color: var(--accent); background: #3a3324; }
  .axis:disabled { cursor: not-allowed; opacity: .5; }
  .axis:disabled i { background: #444 !important; }
  .ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; }
  .badge {
    display: grid;
    grid-template-columns: 30px 1fr;
    gap: 8px;
    align-items: center;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 8px;
  }
  .badge .ico { font-size: 20px; text-align: center; line-height: 1; filter: grayscale(1); opacity: .35; }
  .badge .nm { font-size: 12px; font-weight: 700; color: var(--muted); }
  .badge .ds { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .badge.on { border-color: var(--accent); }
  .badge.on .ico { filter: none; opacity: 1; }
  .badge.on .nm { color: var(--text); }
  .item {
    width: 100%;
    display: grid;
    grid-template-columns: 40px 1fr auto;
    align-items: center;
    gap: 10px;
    text-align: left;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: transform .05s, border-color .1s, opacity .1s;
  }
  .item:not(:disabled):hover { border-color: var(--accent); }
  .item:not(:disabled):active { transform: scale(.985); }
  .item:disabled { opacity: .45; cursor: not-allowed; }
  .item .ico { font-size: 26px; text-align: center; line-height: 1; }
  .item .nm { font-size: 14px; font-weight: 700; }
  .item .ds { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .item .rt { text-align: right; font-variant-numeric: tabular-nums; }
  .item .cost { font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .item .lv { font-size: 11px; color: var(--muted); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%) translateY(20px);
    background: #000c;
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  /* 広い画面: 画面いっぱいに、左がキースイッチ、右がショップ。それぞれの中だけがスクロールする */
  @media (min-width: 821px) {
    body { overflow: hidden; }
    .app {
      max-width: none;
      height: 100%;
      min-height: 0;
      padding: 0;
      gap: 0;
      grid-template-columns: minmax(0, 1fr) 400px;
      grid-template-rows: auto minmax(0, 1fr);
    }
    header { padding: 8px 14px; background: #0f1116; border-bottom: 1px solid var(--line); }
    .stage { background: none; border: 0; border-radius: 0; overflow-y: auto; padding: 14px 16px 10px; }
    .shop { align-self: stretch; border: 0; border-left: 1px solid var(--line); border-radius: 0; overflow-y: auto; }
    .arena { min-height: 250px; }
  }
  @media (max-width: 820px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; padding: 10px; gap: 10px; }
    header { flex-wrap: wrap; }
    .shop { grid-column: 1; grid-row: auto; }
    .ach-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    h1 { font-size: 13px; letter-spacing: 0; }
    .util { flex-shrink: 0; }
    h1 small { display: none; }
    .arena { min-height: 300px; }
    .scrap .num { font-size: 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #switch.shake svg, #switch.spawn { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>⌨️ キースイッチ・クラッシャー<small>叩いて、割って、ばらばらに</small></h1>
    <div class="util">
      <button id="btnAxis" type="button">🎚️ 軸 <span id="axisN"></span></button>
      <button id="btnAch" type="button">🏆 実績 <span id="achN"></span></button>
      <button id="btnSound" type="button" aria-pressed="true">🔊 音</button>
      <button id="btnReset" type="button">最初から</button>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="破壊ステージ">
    <div class="scrap">
      <div class="num" id="scrap">0</div>
      <div class="unit">スクラップ</div>
    </div>
    <div class="rates">
      <span>1打 <b id="perClick">1</b></span>
      <span>毎秒 <b id="perSec">0</b></span>
      <span>会心 <b id="critRate">5%</b></span>
      <span>破壊数 <b id="broken">0</b></span>
    </div>

    <div class="kbd-wrap">
      <div class="kbd-title" id="kbdTitle"></div>
      <div class="kbd" id="kbd" aria-hidden="true"></div>
    </div>

    <div class="target-info">
      <div class="target-name" id="targetName"></div>
      <div class="target-sub" id="targetSub"></div>
      <div class="hp" role="progressbar" aria-label="耐久" aria-valuemin="0" aria-valuemax="100" id="hpBar">
        <i id="hpFill"></i><span id="hpText"></span>
      </div>
    </div>

    <div class="arena" id="arena">
      <canvas id="fx"></canvas>
      <button id="switch" type="button" aria-label="キースイッチを叩く">
        <svg viewBox="10 70 220 200" aria-hidden="true">
          <defs>
            <!-- 正面から見たキーキャップ。天面は中央がわずかにくぼむ -->
            <path id="capShape" d="M50 98 Q52 88 63 88 Q120 95 177 88 Q188 88 190 98 L210 167 Q212 176 202 176 H38 Q28 176 30 167 Z"/>
            <linearGradient id="gMilk" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#e6f2e6"/><stop offset="1" stop-color="#b4c9b7"/>
            </linearGradient>
            <linearGradient id="gPin" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#8a6a1f"/><stop offset=".45" stop-color="#f6e09a"/><stop offset="1" stop-color="#a47f2a"/>
            </linearGradient>
            <!-- 色の上に重ねる陰影 -->
            <linearGradient id="gRound" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#000" stop-opacity=".38"/><stop offset=".3" stop-color="#fff" stop-opacity=".2"/>
              <stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".42"/>
            </linearGradient>
            <linearGradient id="gSkirt" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".12" stop-color="#fff" stop-opacity=".07"/>
              <stop offset=".7" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".4"/>
            </linearGradient>
            <linearGradient id="gSides" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset=".13" stop-color="#000" stop-opacity="0"/>
              <stop offset=".87" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".36"/>
            </linearGradient>
          </defs>
          <ellipse cx="120" cy="260" rx="98" ry="8" fill="#000" opacity=".45"/>
          <ellipse id="underglow" cx="120" cy="198" rx="92" ry="20"/>
          <!-- 端子: 固定用の樹脂ピン、中央の柱、金属の足2本 -->
          <rect x="60" y="244" width="8" height="8" rx="3" fill="#b9cdbb"/>
          <rect x="172" y="244" width="8" height="8" rx="3" fill="#b9cdbb"/>
          <rect x="110" y="244" width="20" height="13" rx="5" fill="#c3d6c5"/>
          <rect x="86" y="244" width="5" height="19" rx="1.5" fill="url(#gPin)"/>
          <rect x="147" y="244" width="5" height="15" rx="1.5" fill="url(#gPin)"/>
          <!-- 軸(押すとキーキャップと一緒に下がる) -->
          <g class="mv">
            <g id="stem" fill="#3d7be0">
              <rect x="101" y="150" width="38" height="52" rx="3"/>
              <rect x="90" y="184" width="60" height="20" rx="3"/>
            </g>
            <rect x="101" y="150" width="38" height="52" rx="3" fill="url(#gRound)"/>
            <rect x="90" y="184" width="60" height="20" rx="3" fill="url(#gRound)"/>
            <rect x="101" y="176" width="38" height="8" fill="#000" opacity=".35"/>
          </g>
          <!-- ばね(透明な上ハウジング越しに見える) -->
          <path d="M106 205 L134 208 L106 211 L134 214 L106 217 L134 220 L106 223" fill="none" stroke="#d8cfae" stroke-width="2" stroke-linejoin="round" opacity=".75"/>
          <!-- 上ハウジング: 透明 -->
          <path d="M70 188 H170 L188 222 H52 Z" fill="#eaf6ff" opacity=".2"/>
          <path d="M74 191 H97 L86 220 H59 Z" fill="#fff" opacity=".16"/>
          <path d="M150 191 H166 L181 220 H160 Z" fill="#fff" opacity=".07"/>
          <path d="M70 188 H170 L188 222 H52 Z" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M97 189 L86 221 M143 189 L154 221" stroke="#fff" stroke-opacity=".3" stroke-width="1.2"/>
          <path d="M72 189.5 H168" stroke="#fff" stroke-opacity=".8" stroke-width="2.2" stroke-linecap="round"/>
          <!-- 下ハウジング: 乳白色 -->
          <rect x="50" y="226" width="140" height="20" rx="4" fill="url(#gMilk)"/>
          <rect x="50" y="226" width="140" height="20" rx="4" fill="url(#gSides)" opacity=".55"/>
          <rect x="46" y="220" width="148" height="8" rx="2.5" fill="#e9f4e9"/>
          <rect x="46" y="220" width="148" height="2" rx="1" fill="#fff" opacity=".7"/>
          <rect x="77" y="228" width="15" height="12" rx="2" fill="#c9dccb" stroke="#a3b8a6" stroke-width="1"/>
          <rect x="148" y="228" width="15" height="12" rx="2" fill="#c9dccb" stroke="#a3b8a6" stroke-width="1"/>
          <rect x="76" y="213" width="14" height="10" rx="2" fill="#fff" opacity=".4"/>
          <rect x="150" y="213" width="14" height="10" rx="2" fill="#fff" opacity=".4"/>
          <!-- キーキャップ: スイッチと同じ正面から見た形で、軸の真上にまっすぐ載る。
               押し込むと裾が上ハウジングにかぶさるので、ハウジングより手前に描く -->
          <g class="mv">
            <use href="#capShape" id="capSkirt" fill="#17181c"/>
            <use href="#capShape" fill="url(#gSkirt)"/>
            <use href="#capShape" fill="url(#gSides)"/>
            <path d="M63 89.5 Q120 96.5 177 89.5" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M36 174.5 H204" stroke="#000" stroke-opacity=".5" stroke-width="2"/>
            <!-- サイドプリント: 手前の側面の刻印がバックライトで光る -->
            <text id="legend" x="120" y="147" text-anchor="middle" font-size="30" font-weight="500" letter-spacing="1"
                  font-family="'Helvetica Neue', Arial, system-ui, sans-serif">A</text>
            <path class="crack" id="crack1" d="M72 89 L86 110 L78 128 L96 144"/>
            <path class="crack" id="crack2" d="M198 126 L168 130 L158 150 L134 154 L128 176 M158 150 L176 166"/>
            <path class="crack" id="crack3" d="M34 152 L66 146 L96 144 L108 160 L98 176 M86 110 L118 106 L136 91"/>
          </g>
        </svg>
      </button>
    </div>

(() => {

  // ---------- データ ----------

    { id: 'silver', name: '銀軸', kind: 'スピード', color: '#c9ced8', need: 4, snd: { down: [[420, 4, 0.7], [1300, 4, 0.4], [3000, 3, 0.25]], up: [[900, 4, 0.3], [3200, 3, 0.2]], ping: 5200, gap: 0.055 } },
    { id: 'pink', name: '桃軸', kind: '静音', color: '#f09ab8', need: 5, snd: { down: [[180, 3, 0.18], [500, 2, 0.07]], up: [[320, 2, 0.07]] } },
    { id: 'green', name: '緑軸', kind: '重めのクリッキー', color: '#3fae5a', need: 6, snd: { tick: [[4300, 14, 0.6], [2800, 8, 0.4]], down: [[250, 6, 1], [750, 4, 0.42], [1800, 3, 0.22]], up: [[560, 4, 0.32], [2300, 3, 0.2]], ping: 4000, gap: 0.095 } },
    { id: 'purple', name: '紫軸', kind: '光学式', color: '#8f5fe0', need: 7, snd: { down: [[350, 5, 0.7], [1100, 5, 0.4], [2600, 4, 0.2]], up: [[800, 4, 0.28], [2800, 3, 0.16]], gap: 0.065 } },

  // 1台のキーボードは36キー。A→Z、つづいて 1→0 の順に壊していく
  const ORDER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890';

  // kind: click = 1打の威力, auto = 毎秒ダメージ, crit = 会心率
  const ITEMS = [
    { id: 'finger', kind: 'click', ico: '☝️', name: '指トレ', val: 1, base: 10 },
    { id: 'puller', kind: 'click', ico: '🗜️', name: 'キープラー', val: 5, base: 120 },
    { id: 'driver', kind: 'click', ico: '🪛', name: 'マイナスドライバー', val: 25, base: 1500 },
    { id: 'hammer', kind: 'click', ico: '🔨', name: 'ハンマー', val: 120, base: 15000 },
    { id: 'drill', kind: 'click', ico: '🛠️', name: '電動ドリル', val: 600, base: 150000 },
    { id: 'crit', kind: 'crit', ico: '🎯', name: '急所ねらい', val: 2, base: 250, growth: 1.3, max: 25 },
    { id: 'cat', kind: 'auto', ico: '🐈', name: 'キーボードに乗る猫', val: 1, base: 30 },
    { id: 'coffee', kind: 'auto', ico: '☕', name: 'こぼれたコーヒー', val: 6, base: 400 },
    { id: 'rage', kind: 'auto', ico: '👊', name: '台パン', val: 30, base: 3500 },
    { id: 'solder', kind: 'auto', ico: '🔥', name: 'はんだごて', val: 150, base: 30000 },
    { id: 'press', kind: 'auto', ico: '🏭', name: '油圧プレス', val: 800, base: 250000 },
    { id: 'laser', kind: 'auto', ico: '🛰️', name: '衛星レーザー', val: 4500, base: 2500000 },
  ];
  const SECTIONS = [
    ['click', '工具(1打の威力)'],
    ['crit', '技・強化'],
    ['auto', '自動破壊(毎秒)'],
  ];

  // 1回かぎりの強化。req を満たすと買えるようになる
  const TIER_REQ = [10, 25, 50], TIER_COST = [12, 150, 2500], TIER_NAME = ['改', '真', '極'];
  const ROMAN = ['I', 'II', 'III', 'IV'];
  const UPGRADES = [];
  for (const it of ITEMS) {
    if (it.kind === 'crit') continue;
    TIER_REQ.forEach((req, k) => UPGRADES.push({
      id: it.id + '_t' + k, ico: it.ico, tool: it.id,
      name: `${it.name}・${TIER_NAME[k]}`, desc: `${it.name}の効果 2倍`,
      cost: it.base * TIER_COST[k], need: `${it.name}を${req}個`, req: () => lv(it.id) >= req,
    }));
  }
  [[5, 5000], [20, 400000], [50, 3e7], [100, 3e9]].forEach(([n, c], k) => UPGRADES.push({
    id: 'gclick' + k, ico: '⚒️', group: 'gclick',
    name: '工具の焼き入れ ' + ROMAN[k], desc: 'すべての工具の威力 2倍',
    cost: c, need: `スイッチを${n}個破壊`, req: () => S.broken >= n,
  }));
  [[10, 20000], [30, 1.5e6], [70, 1e8], [140, 1e10]].forEach(([n, c], k) => UPGRADES.push({
    id: 'gauto' + k, ico: '⚡', group: 'gauto',
    name: '過負荷運転 ' + ROMAN[k], desc: 'すべての自動破壊 2倍',
    cost: c, need: `スイッチを${n}個破壊`, req: () => S.broken >= n,
  }));
  [[5, 30000], [15, 5e6]].forEach(([n, c], k) => UPGRADES.push({
    id: 'critx' + k, ico: '💥', group: 'critx',
    name: '会心の極意 ' + ROMAN[k], desc: '会心の倍率 +5倍',
    cost: c, need: `急所ねらいを${n}個`, req: () => lv('crit') >= n,
  }));
  [[50, 80000], [5000, 2e7]].forEach(([n, c], k) => UPGRADES.push({
    id: 'syn' + k, ico: '🐾', group: 'syn',
    name: '猫の手も借りる ' + ROMAN[k], desc: '1打に毎秒ダメージの3%を上乗せ',
    cost: c, need: `毎秒ダメージ ${n.toLocaleString('ja-JP')}`, req: () => autoPower() >= n,
  }));

  const upCount = () => UPGRADES.filter(u => S.ups[u.id]).length;
  const ACH = [
    { id: 'hit1', ico: '👆', name: 'はじめの一打', desc: 'スイッチを1回叩く', ok: () => S.clicks >= 1 },
    { id: 'hit100', ico: '✊', name: '百裂打ち', desc: '100回叩く', ok: () => S.clicks >= 100 },
    { id: 'hit1000', ico: '⚾', name: '千本ノック', desc: '1,000回叩く', ok: () => S.clicks >= 1000 },
    { id: 'hit10000', ico: '🩹', name: '腱鞘炎予備軍', desc: '10,000回叩く', ok: () => S.clicks >= 10000 },
    { id: 'fast', ico: '💨', name: '目にも止まらぬ', desc: '1秒間に10回叩く', ok: () => S.fast },
    { id: 'keys100', ico: '⌨️', name: 'タイピスト', desc: 'キーボードで100回叩く', ok: () => S.keys >= 100 },
    { id: 'crit1', ico: '🎯', name: '会心の手応え', desc: '会心を出す', ok: () => S.crits >= 1 },
    { id: 'crit100', ico: '💥', name: '急所マニア', desc: '会心を100回出す', ok: () => S.crits >= 100 },
    { id: 'break1', ico: '🧩', name: '初破壊', desc: '最初のスイッチを壊す', ok: () => S.broken >= 1 },
    { id: 'break10', ico: '🧰', name: '解体屋', desc: 'スイッチを10個壊す', ok: () => S.broken >= 10 },
    { id: 'break30', ico: '🪦', name: 'スイッチの墓場', desc: 'スイッチを30個壊す', ok: () => S.broken >= 30 },
    { id: 'kb1', ico: '👑', name: '一台まるごと', desc: 'キーボードを1台壊しきる', ok: () => kbCount() >= 1 },
    { id: 'kb3', ico: '🚮', name: '壊し屋', desc: 'キーボードを3台壊しきる', ok: () => kbCount() >= 3 },
    { id: 'allaxes', ico: '🌈', name: '軸マニア', desc: 'すべての軸を手に入れる', ok: () => kbCount() >= SWITCH_TYPES.length - 1 },
    { id: 'scrap1k', ico: '🪙', name: '小銭かせぎ', desc: 'スクラップを累計1,000', ok: () => S.total >= 1e3 },
    { id: 'scrap1m', ico: '💰', name: 'スクラップ長者', desc: 'スクラップを累計100万', ok: () => S.total >= 1e6 },
    { id: 'scrap100m', ico: '🏦', name: 'スクラップ王', desc: 'スクラップを累計1億', ok: () => S.total >= 1e8 },
    { id: 'tools', ico: '🧲', name: '工具コレクター', desc: '工具を全種類そろえる', ok: () => ITEMS.every(i => i.kind !== 'click' || lv(i.id) > 0) },
    { id: 'autos', ico: '🤖', name: '全自動工場', desc: '自動破壊を全種類そろえる', ok: () => ITEMS.every(i => i.kind !== 'auto' || lv(i.id) > 0) },
    { id: 'cat10', ico: '🐈', name: '猫だまり', desc: '猫を10匹乗せる', ok: () => lv('cat') >= 10 },
    { id: 'dps1000', ico: '🛋️', name: 'ほったらかし名人', desc: '毎秒ダメージ1,000', ok: () => autoPower() >= 1000 },
    { id: 'up1', ico: '📜', name: '道具は使いよう', desc: '強化を1つ習得する', ok: () => upCount() >= 1 },
    { id: 'up10', ico: '🥋', name: '免許皆伝', desc: '強化を10個習得する', ok: () => upCount() >= 10 },
  ];
  const SAVE_KEY = 'keyswitch-crusher-v2';

  // ---------- 状態 ----------
  const fresh = () => ({
    scrap: 0, total: 0, broken: 0, level: 1, hp: 0,
    clicks: 0, crits: 0, keys: 0, fast: false,
    owned: {}, ups: {}, ach: {}, sw: 'blue', buy: 1, sound: true,
  });
  let S = fresh();
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (raw && typeof raw === 'object') S = Object.assign(fresh(), raw);
  } catch (e) { /* 保存が読めなくても遊べる */ }
  const save = () => {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* 同上 */ }
  };

  const lv = id => S.owned[id] || 0;
  const kbCount = () => Math.floor((S.level - 1) / ORDER.length); // 壊しきったキーボードの台数
  const curType = () => SWITCH_TYPES.find(t => t.id === S.sw && kbCount() >= t.need) || SWITCH_TYPES[0];
  const costAt = (it, level) => Math.floor(it.base * Math.pow(it.growth || 1.15, level));
  // いまの「まとめ買い」設定で買う個数 n と合計額。S.buy は 1・10・100、または 'max'(全財産で買えるだけ)
  function bundle(it) {
    const have = lv(it.id);
    const room = it.max ? it.max - have : Infinity;
    const all = S.buy === 'max';
    const want = Math.min(room, all ? 1000 : S.buy);
    let n = 0, total = 0;
    while (n < want) {
      const c = costAt(it, have + n);
      if (all && total + c > S.scrap) break;
      total += c;
      n++;
    }
    if (n === 0 && room > 0) total = costAt(it, have); // 全財産でも1個に届かないときは、1個の値段を見せる
    return { n, cost: total };
  }

  // 強化による倍率。買ったときと読み込んだときに作り直す
  let M;
  function recalc() {
    const n = g => UPGRADES.filter(u => u.group === g && S.ups[u.id]).length;
    M = { tool: {}, gclick: Math.pow(2, n('gclick')), gauto: Math.pow(2, n('gauto')),
          critMult: 5 + 5 * n('critx'), syn: 0.03 * n('syn') };
    for (const it of ITEMS) {
      M.tool[it.id] = Math.pow(2, UPGRADES.filter(u => u.tool === it.id && S.ups[u.id]).length);
    }
  }
  recalc();
  const sumOf = kind => ITEMS.filter(i => i.kind === kind)
    .reduce((a, i) => a + i.val * lv(i.id) * M.tool[i.id], 0);
  const autoPower = () => sumOf('auto') * M.gauto;
  const clickPower = () => (1 + sumOf('click')) * M.gclick + autoPower() * M.syn;
  const critChance = () => (5 + sumOf('crit')) / 100;

  const maxHp = level => Math.floor(1000 * Math.pow(1.06, level - 1));

  const UNITS = ['', '万', '億', '兆', '京', '垓', '𥝱', '穣'];
  function fmt(n) {
    n = Math.floor(n);
    if (n < 10000) return n.toLocaleString('ja-JP');
    let u = 0;
    while (n >= 10000 && u < UNITS.length - 1) { n /= 10000; u++; }
    return (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + UNITS[u];
  }

  // ---------- 要素 ----------
  const $ = id => document.getElementById(id);
  const el = {
    scrap: $('scrap'), perClick: $('perClick'), perSec: $('perSec'), critRate: $('critRate'),
    broken: $('broken'), targetName: $('targetName'), targetSub: $('targetSub'),
    hpFill: $('hpFill'), hpText: $('hpText'), hpBar: $('hpBar'),
    arena: $('arena'), sw: $('switch'), fx: $('fx'), shop: $('shop'), toast: $('toast'),
    stem: $('stem'), capSkirt: $('capSkirt'), legend: $('legend'),
    cracks: [$('crack1'), $('crack2'), $('crack3')],
    btnSound: $('btnSound'), btnReset: $('btnReset'),
  };

  // ---------- 音 ----------
  let actx = null;
  function audio() {
    if (!S.sound) return null;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { return null; }
    return actx;
  }
  function noise(dur, freq, vol) {
    const a = audio();
    if (!a) return;
    const len = Math.max(1, Math.floor(a.sampleRate * dur));
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    const src = a.createBufferSource();
    src.buffer = buf;
    const f = a.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
    const g = a.createGain();
    g.gain.value = vol;
    src.connect(f).connect(g).connect(a.destination);
    src.start();
  }
  function tone(freq, dur, vol) {
    const a = audio();
    if (!a) return;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g).connect(a.destination);
    o.start();
    o.stop(a.currentTime + dur);
  }
  // 録音した打鍵音(押してから離すまでの1打ぶん、WAV を base64 にしたもの)。

  const SAMPLE_GAIN = 0.4;
  const sampleBufs = {};
  // ページを開いた時点で読み込んでおく(再生用の AudioContext は操作があるまで作れないので、読み込みは別口で行う)
  function loadSamples() {
    let a;
    try {
      a = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 1, 44100);
    } catch (e) { return; }
    for (const id of Object.keys(SAMPLES)) {
      try {
        const bin = atob(SAMPLES[id]);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        a.decodeAudioData(bytes.buffer, buf => { sampleBufs[id] = buf; }, () => {});
      } catch (e) { /* 読めなければ合成音のまま */ }
    }
  }
  function playSample(buf) {
    const a = audio();
    if (!a) return;
    const src = a.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = 0.97 + Math.random() * 0.06; // 1打ごとにわずかに揺らす
    const g = a.createGain();
    g.gain.value = SAMPLE_GAIN * (0.85 + Math.random() * 0.3);
    src.connect(g).connect(a.destination);
    src.start();
  }

  // 短い雑音を共鳴フィルターの束に通して、樹脂が当たる音を作る
  const SND_GAIN = 4; // 実測で、1打の最大振幅がおよそ 0.3 になる値
  let master = null, impulse = null;
  function strike(modes, when, vol, pitch) {
    const a = audio();
    if (!a) return;
    if (!master) {
      master = a.createDynamicsCompressor();
      master.connect(a.destination);
    }
    if (!impulse) {
      const len = Math.floor(a.sampleRate * 0.004);
      impulse = a.createBuffer(1, len, a.sampleRate);
      const d = impulse.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    }
    const src = a.createBufferSource();
    src.buffer = impulse;
    for (const [f, q, g] of modes) {
      const bp = a.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = f * pitch * (0.96 + Math.random() * 0.08);
      bp.Q.value = q;
      const gn = a.createGain();
      gn.gain.value = g * vol * SND_GAIN * Math.sqrt(1000 / f); // 低い共鳴ほど通る量が減るぶんを補う
      src.connect(bp).connect(gn).connect(master);
    }
    src.start(a.currentTime + when);
  }
  let lastSnd = 0;
  function sndHit() {
    const now = performance.now();
    if (now - lastSnd < 25) return;
    lastSnd = now;
    const type = curType();
    if (sampleBufs[type.id]) { playSample(sampleBufs[type.id]); return; }
    const s = type.snd;
    const v = 0.85 + Math.random() * 0.3;
    const p = 1;
    const up = s.gap || 0.08;
    if (s.tick) strike(s.tick, 0, v, p);
    strike(s.down, s.tick ? 0.012 : 0, v, p);
    if (s.ping) strike([[s.ping, 45, 0.05]], 0.004, v, 1);
    if (s.tick) strike(s.tick, up - 0.01, v * 0.6, p * 1.06);
    strike(s.up, up, v * 0.7, p);
  }
  function sndBreak(big) {
    noise(big ? 0.5 : 0.22, big ? 500 : 900, 0.6);
    noise(0.12, 3200, 0.25);
  }

  // ---------- パーティクル ----------
  const ctx = el.fx.getContext('2d');
  let parts = [];
  let fxW = 0, fxH = 0;
  function resizeFx() {
    const r = el.arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    fxW = r.width; fxH = r.height;
    el.fx.width = Math.round(fxW * dpr);
    el.fx.height = Math.round(fxH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeFx);

  function burst(x, y, n, colors, power, shapes) {
    for (let i = 0; i < n && parts.length < 400; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = power * (0.3 + Math.random());
      parts.push({
        x, y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - power * 0.6,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 14,
        size: 3 + Math.random() * 6,
        color: colors[(Math.random() * colors.length) | 0],
        shape: shapes[(Math.random() * shapes.length) | 0],
        life: 0.7 + Math.random() * 0.7, age: 0,
      });
    }
  }

        ctx.fillRect(-s / 2, -s / 2, s, s);
        ctx.fillStyle = '#ffffff55';
        ctx.fillRect(-s / 2 + 2, -s / 2 + 2, s - 4, s * 0.3);
      } else {
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
      }
      ctx.restore();
    }
    parts = parts.filter(p => p.age < p.life && p.y < fxH + 40);
  }

  function floatText(text, x, y, cls) {
    if (el.arena.querySelectorAll('.float').length > 40) return;
    const s = document.createElement('span');
    s.className = 'float' + (cls ? ' ' + cls : '');
    s.textContent = text;
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    s.addEventListener('animationend', () => s.remove());
    el.arena.appendChild(s);
  }

  // ---------- スイッチ ----------
  let capColors = ['#2c2d33', '#17181c'];
  let stemColor = '#e0443e';

  function setLegend(t) { el.legend.textContent = t; }

  const kbdEls = [];
  function buildKbd() {
    const by = {};
    for (const row of KB_ROWS) {
      const r = document.createElement('div');
      r.className = 'row';
      for (const ch of row) {
        const k = document.createElement('span');
        k.className = 'k';
        k.textContent = ch;
        r.appendChild(k);
        by[ch] = k;
      }
      $('kbd').appendChild(r);
    }
    for (const ch of ORDER) kbdEls.push(by[ch]);
  }

  function dressSwitch(animate) {
    const L = S.level;
    const kb = kbCount();
    const idx = (L - 1) % ORDER.length;
    const type = curType();
    stemColor = type.color;
    el.stem.setAttribute('fill', stemColor);
    const glow = `hsl(${(200 + kb * 67) % 360} 95% 68%)`; // バックライトの色はキーボードごとに変わる
    capColors = ['#2c2d33', '#17181c', glow];
    el.capSkirt.setAttribute('fill', capColors[1]);
    setLegend(ORDER[idx]);
    el.targetName.textContent = `「${ORDER[idx]}」キー(${type.name})`;
    el.targetSub.textContent = `${type.kind} ・ 通算 ${fmt(L)} 個目`;
    el.sw.style.setProperty('--glow', glow);
    $('kbd').style.setProperty('--glow', glow);
    kbdEls.forEach((k, i) => {
      k.classList.toggle('done', i < idx);
      k.classList.toggle('cur', i === idx);
    });
    $('kbdTitle').innerHTML = `キーボード <b>${fmt(kb + 1)}</b> 台目 ・ のこり <b>${ORDER.length - idx}</b> / ${ORDER.length} キー`;
    if (animate) {
      el.sw.classList.remove('spawn');
      void el.sw.offsetWidth;
      el.sw.classList.add('spawn');
    }
  }

  function drawHp() {
    const m = maxHp(S.level);
    const r = Math.max(0, Math.min(1, S.hp / m));
    el.hpFill.style.transform = `scaleX(${r})`;
    el.hpText.textContent = `${fmt(Math.ceil(S.hp))} / ${fmt(m)}`;
    el.hpBar.setAttribute('aria-valuenow', Math.round(r * 100));
    el.cracks[0].classList.toggle('on', r < 0.75);
    el.cracks[1].classList.toggle('on', r < 0.5);
    el.cracks[2].classList.toggle('on', r < 0.25);
  }

  function center() {
    const a = el.arena.getBoundingClientRect();
    const s = el.sw.getBoundingClientRect();
    return { x: s.left - a.left + s.width / 2, y: s.top - a.top + s.height * 0.42 };
  }

  let lastBreakFx = 0;
  function breakSwitch() {
    S.broken++;
    S.level++;
    S.hp = maxHp(S.level);
    const done = (S.level - 1) % ORDER.length === 0; // キーボードを1台壊しきった
    if (done) {
      const n = kbCount();
      const got = SWITCH_TYPES.find(t => t.need === n);
      toast(`🎉 キーボード ${fmt(n)} 台目を壊しきった！` + (got ? ` 🎁 新しい軸: ${got.name}` : ''));
      renderAxes();
    }
    const now = performance.now();
    if (done || now - lastBreakFx > 90) {
      lastBreakFx = now;
      const c = center();
      burst(c.x, c.y, done ? 60 : 22, capColors, done ? 560 : 380, ['cap', 'chip', 'chip']);
      burst(c.x, c.y + 40, done ? 18 : 6, [stemColor, '#2a2d36', '#d9b24a'], 320, ['chip', 'spring']);
      floatText(done ? 'キーボード破壊！' : '破壊！', c.x, c.y - 70, 'gain');
      sndBreak(done);
      dressSwitch(true);
    } else {
      dressSwitch(false);
    }
    dirty = true;
  }

  // ダメージを与える。あふれた分は次のスイッチへ持ち越す
  function damage(amount) {
    S.scrap += amount; S.total += amount; // 破壊の報酬はなく、与えたダメージがスクラップになる
    let guard = 0;
    while (amount > 0 && guard++ < 500) {
      const take = Math.min(amount, S.hp);
      S.hp -= take;
      amount -= take;
      if (S.hp <= 0) breakSwitch();
    }
  }

  let upTimer = 0;
  let hitTimes = [];
  function hit(x, y) {
    const crit = Math.random() < critChance();
    const dmg = clickPower() * (crit ? M.critMult : 1);
    S.clicks++;
    if (crit) S.crits++;
    const t = performance.now();
    hitTimes.push(t);
    while (t - hitTimes[0] > 1000) hitTimes.shift();
    if (hitTimes.length >= 10) S.fast = true;
    if (x == null) {
      const c = center();
      x = c.x + (Math.random() - 0.5) * 90;
      y = c.y + (Math.random() - 0.5) * 50;
    }
    floatText((crit ? '会心 ' : '') + fmt(dmg), x, y - 20, crit ? 'crit' : '');
    burst(x, y, crit ? 10 : 4, capColors, crit ? 300 : 200, ['chip']);
    sndHit();
    el.sw.classList.add('down');
    el.sw.classList.remove('shake');
    void el.sw.offsetWidth;
    el.sw.classList.add('shake');
    clearTimeout(upTimer);
    upTimer = setTimeout(() => el.sw.classList.remove('down'), 70);
    damage(dmg);
    drawHp();
  }

  // ---------- 工具店 ----------
  const itemEls = {};
  let upsBox, upsNote, upsKey = null, upEls = [];
  function descOf(it) {
    const m = M.tool[it.id];
    return it.kind === 'click' ? `1打 +${fmt(it.val * m * M.gclick)}`
      : it.kind === 'auto' ? `毎秒 +${fmt(it.val * m * M.gauto)}`
      : `会心率 +${it.val}%(会心は${M.critMult}倍)`;
  }
  const ITEM_HTML = ico => `<span class="ico" aria-hidden="true">${ico}</span>
    <span><div class="nm"></div><div class="ds"></div></span>
    <span class="rt"><div class="cost"></div><div class="lv"></div></span>`;
  function makeItem(ico, name, onBuy) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'item';
    b.innerHTML = ITEM_HTML(ico);
    b.querySelector('.nm').textContent = name;
    b.addEventListener('click', e => {
      onBuy();
      if (e.detail > 0) b.blur(); // マウス・タッチのあとはキーボード連打に戻れるように
    });
    return { b, ds: b.querySelector('.ds'), cost: b.querySelector('.cost'), lv: b.querySelector('.lv') };
  }
  function buildShop() {
    for (const [kind, title] of SECTIONS) {
      const h = document.createElement('h2');
      h.textContent = title;
      el.shop.appendChild(h);
      for (const it of ITEMS.filter(i => i.kind === kind)) {
        const e = makeItem(it.ico, it.name, () => buy(it));
        el.shop.appendChild(e.b);
        itemEls[it.id] = e;
      }
      if (kind === 'crit') {
        upsBox = document.createElement('div');
        upsNote = document.createElement('div');
        upsNote.className = 'ups-note';
        el.shop.append(upsBox, upsNote);
      }
    }
  }
  function bought() {
    dirty = true;
    render();
    checkAch();
    save();
  }
  function buy(it) {
    const { n, cost } = bundle(it);
    if (n < 1 || S.scrap < cost) return;
    S.scrap -= cost;
    S.owned[it.id] = lv(it.id) + n;
    bought();
  }
  function buyUp(u) {
    if (S.ups[u.id] || S.scrap < u.cost || !u.req()) return;
    S.scrap -= u.cost;
    S.ups[u.id] = 1;
    recalc();
    bought();
  }

  // 買える強化すべてと、まだ条件を満たしていない強化を安い順に3つまで見せる
  function renderUps() {
    const open = UPGRADES.filter(u => !S.ups[u.id]);
    const avail = open.filter(u => u.req()).sort((a, b) => a.cost - b.cost);
    const locked = open.filter(u => !avail.includes(u)).sort((a, b) => a.cost - b.cost).slice(0, 3);
    const key = avail.map(u => u.id).join() + '|' + locked.map(u => u.id).join();
    if (key !== upsKey) {
      upsKey = key;
      upsBox.textContent = '';
      upEls = [];
      for (const u of avail.concat(locked)) {
        const ok = avail.includes(u);
        const e = makeItem(u.ico, u.name, () => buyUp(u));
        e.b.classList.add('up');
        e.b.classList.toggle('locked', !ok);
        e.ds.textContent = u.desc;
        e.cost.textContent = fmt(u.cost);
        e.lv.textContent = ok ? '1回かぎり' : '🔒 ' + u.need;
        upsBox.appendChild(e.b);
        upEls.push({ u, b: e.b, ok });
      }
      upsNote.textContent = `習得済みの強化 ${UPGRADES.length - open.length} / ${UPGRADES.length}`;
    }
    for (const e of upEls) e.b.disabled = !e.ok || S.scrap < e.u.cost;
  }

  let dirty = true;
  function setText(node, t) { if (node.textContent !== t) node.textContent = t; }
  function render() {
    setText(el.scrap, fmt(S.scrap));
    setText(el.perClick, fmt(clickPower()));
    setText(el.perSec, fmt(autoPower()));
    setText(el.critRate, Math.round(critChance() * 100) + '%');
    setText(el.broken, fmt(S.broken));
    for (const it of ITEMS) {
      const e = itemEls[it.id];
      const maxed = it.max && lv(it.id) >= it.max;
      setText(e.ds, descOf(it));
      const { n, cost } = bundle(it);
      const html = maxed ? '最大' : (S.buy === 1 ? '' : `<small>×${Math.max(n, 1)}</small>`) + fmt(cost);
      if (e.cost.innerHTML !== html) e.cost.innerHTML = html;
      setText(e.lv, '所持 ' + lv(it.id));
      e.b.disabled = maxed || n < 1 || S.scrap < cost;
    }
    renderUps();
    dirty = false;
  }

  // ---------- 実績 ----------
  const achEls = {};
  function buildAch() {
    for (const a of ACH) {
      const d = document.createElement('div');
      d.className = 'badge';
      d.innerHTML = `<span class="ico" aria-hidden="true">${a.ico}</span>
        <span><div class="nm">${a.name}</div><div class="ds">${a.desc}</div></span>`;
      $('achGrid').appendChild(d);
      achEls[a.id] = d;
    }
    renderAch();
  }
  function renderAch() {
    let n = 0;
    for (const a of ACH) {
      const on = !!S.ach[a.id];
      if (on) n++;
      achEls[a.id].classList.toggle('on', on);
    }
    $('achTitle').textContent = `実績 ${n} / ${ACH.length}`;
    $('achN').textContent = `${n}/${ACH.length}`;
    renderAxes();
  }

  const axisEls = {};
  function buildAxes() {
    for (const t of SWITCH_TYPES) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'axis';
      b.innerHTML = `<i style="background:${t.color}"></i><span><div class="nm">${t.name}</div><div class="ds"></div></span>`;
      b.addEventListener('click', e => {
        if (kbCount() < t.need) return;
        S.sw = t.id;
        dressSwitch(true);
        renderAxes();
        lastSnd = 0;
        sndHit(); // 選んだ軸の音を試し聞き
        save();
        if (e.detail > 0) b.blur();
      });
      $('axes').appendChild(b);
      axisEls[t.id] = { b, ds: b.querySelector('.ds') };
    }
  }
  function renderAxes() {
    const n = kbCount();
    const cur = curType();
    for (const t of SWITCH_TYPES) {
      const e = axisEls[t.id];
      const have = n >= t.need;
      e.b.disabled = !have;
      e.b.setAttribute('aria-pressed', String(t === cur));
      e.ds.textContent = have ? t.kind : `🔒 ${t.need}台破壊`;
    }
    const have = SWITCH_TYPES.filter(t => n >= t.need).length;
    $('axisTitle').textContent = `軸コレクション ${have} / ${SWITCH_TYPES.length}`;
    $('axisN').textContent = `${have}/${SWITCH_TYPES.length}`;
  }
  function checkAch() {
    const got = ACH.filter(a => !S.ach[a.id] && a.ok());
    if (!got.length) return;
    for (const a of got) S.ach[a.id] = 1;
    renderAch();
    toast('🏆 実績解除: ' + got.map(a => a.name).join('、'));
    save();
  }

  let toastTimer = 0, toastMsgs = [];
  function toast(msg) {
    toastMsgs = toastMsgs.concat(msg).slice(-2); // 重なったら直近の2件を並べる
    el.toast.textContent = toastMsgs.join(' / ');
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.toast.classList.remove('show'); toastMsgs = []; }, 4000);
  }

  // ---------- 入力 ----------
  el.sw.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    const a = el.arena.getBoundingClientRect();
    hit(e.clientX - a.left, e.clientY - a.top);
  });
  el.sw.addEventListener('contextmenu', e => e.preventDefault());

  // 軸コレクションと実績は、上のボタンから開く小窓に入っている
  for (const [btn, dlg] of [['btnAxis', 'dlgAxis'], ['btnAch', 'dlgAch']]) {
    const d = $(dlg);
    $(btn).addEventListener('click', () => d.showModal());
    d.addEventListener('click', e => {
      if (e.target === d || e.target.closest('[data-close]')) d.close(); // 外側か「閉じる」で閉じる
    });
  }

  window.addEventListener('keydown', e => {
    if (document.querySelector('dialog[open]')) return; // 小窓を開いている間は叩かない
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Tab' || e.key === 'Escape' || /^F\d+$/.test(e.key)) return;
    const ae = document.activeElement;
    const onControl = ae && ae !== el.sw && ae.tagName === 'BUTTON';
    if (onControl && (e.key === 'Enter' || e.key === ' ')) return; // ボタンの操作を優先
    if (e.key.length === 1 || e.key === 'Enter' || e.key === 'Backspace') e.preventDefault();
    S.keys++;
    hit(null, null);
  });

  function drawBuyMode() {
    for (const b of $('buyMode').querySelectorAll('button')) {
      b.setAttribute('aria-pressed', String(b.dataset.n === String(S.buy)));
    }
  }
  $('buyMode').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    S.buy = b.dataset.n === 'max' ? 'max' : Number(b.dataset.n);
    drawBuyMode();
    render();
    save();
    if (e.detail > 0) b.blur();
  });

  function drawSoundBtn() {
    el.btnSound.textContent = S.sound ? '🔊 音' : '🔇 音';
    el.btnSound.setAttribute('aria-pressed', String(S.sound));
  }
  el.btnSound.addEventListener('click', () => {
    S.sound = !S.sound;
    drawSoundBtn();
    save();
  });
  el.btnReset.addEventListener('click', () => {
    if (!confirm('スクラップも工具もすべて消して、最初からやり直しますか？')) return;
    const sound = S.sound;
    S = fresh();
    S.sound = sound;
    drawBuyMode();
    S.hp = maxHp(1);
    parts = [];
    hitTimes = [];
    recalc();
    renderAch();
    dressSwitch(true);
    drawHp();
    render();
    save();
  });

  // ---------- ループ ----------
  let last = performance.now();
  let acc = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 3600); // タブを離れていた分も最大1時間まで進める
    last = now;
    const dps = autoPower();
    if (dps > 0) {
      damage(dps * dt);
      drawHp();
    }
    drawParts(Math.min(dt, 0.05));
    acc += dt;
    if (dirty || acc > 0.25) { render(); checkAch(); acc = 0; }
    requestAnimationFrame(frame);
  }

  // ---------- 開始 ----------
  if (![1, 10, 100, 'max'].includes(S.buy)) S.buy = 1;
  loadSamples();
  buildShop();
  drawBuyMode();
  buildKbd();
  buildAxes();
  buildAch();
  if (!(S.hp > 0) || S.hp > maxHp(S.level)) S.hp = maxHp(S.level);
  dressSwitch(false);
  drawHp();
  drawSoundBtn();
  render();
  resizeFx();
  if (S.total > 0) toast('おかえりなさい。つづきから再開します');
  setInterval(save, 5000);
  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
